          unzip -q /tmp/gradle.zip -d "$HOME"
      - name: Verificar assinatura fixa
        script: |
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          test -f "$CM_KEYSTORE_PATH"
      - name: Compilar DORAMAX-GRATIS
        script: |
          "$HOME/gradle-8.7/bin/gradle" :app:assembleRelease --no-daemon
    artifacts:
