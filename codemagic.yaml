workflows:
  android-debug:
    name: DORAMAX-GRATIS APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - A2:2F:14:97:DE:37:9D:55:B8:D5:ED:AC:C0:06:C4:88:ED:76:BB:B2:06:5B:D2:59:86:4F:79:AE:1B:5A:65:FD:FD
    scripts:
      - name: Configurar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Instalar SDK Android e Gradle 8.7
        script: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
      - name: Verificar assinatura fixa
        script: |
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          test -f "$CM_KEYSTORE_PATH"
      - name: Compilar DORAMAX-GRATIS
        script: |
          "$HOME/gradle-8.7/bin/gradle" :app:assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release:
    name: DORAMAX-GRATIS RELEASE ASSINADO
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - A2:2F:14:97:DE:37:9D:55:B8:D5:ED:AC:C0:06:C4:88:ED:76:BB:B2:06:5B:D2:59:86:4F:79:AE:1B:5A:65:FD
    scripts:
      - name: Configurar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Instalar SDK Android e Gradle 8.7
        script: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
      - name: Verificar assinatura fixa
        script: |
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          test -f "$CM_KEYSTORE_PATH"
      - name: Compilar DORAMAX-GRATIS
        script: |
          "$HOME/gradle-8.7/bin/gradle" :app:clean :app:assembleRelease --no-daemon
      - name: Validar APK gerado e assinatura
        script: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/doramax-signature.txt
          ACTUAL_CERT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' /tmp/doramax-signature.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="a22f1497de379d55b8d5edacc006c488ed76bbb2065bd259864f79ae1b5a65fd"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.meuplayer.app' versionCode='73' versionName='5.36'"
    artifacts:
      - app/build/outputs/apk/release/*.apk

  doramax-adm:
    name: DORAMAX ADM APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Configurar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Instalar Gradle 8.7
        script: |
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
      - name: Compilar DORAMAX ADM
        script: |
          "$HOME/gradle-8.7/bin/gradle" :admin:assembleDebug --no-daemon
    artifacts:
      - admin/build/outputs/apk/debug/*.apk
