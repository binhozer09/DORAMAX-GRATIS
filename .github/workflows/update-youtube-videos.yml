name: Atualizar vídeos do YouTube
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-videos-youtube
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Buscar vídeos novos do canal
        run: python scripts/update_youtube_feed.py
      - name: Salvar catálogo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "Nenhum vídeo novo."
          else
            git commit -m "Atualiza vídeos do canal automaticamente"
            git push
          fi
