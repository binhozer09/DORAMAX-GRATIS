name: Gerar APK de teste - anuncio do player

on:
  push:
    branches:
      - feature/native-video-player-ad-330x45
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-player-ad-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Gerar APK Android para teste
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: DORAMAX-GRATIS-player-video-ad-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
