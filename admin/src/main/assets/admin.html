<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#090909"><title>DORAMAX ADM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font:15px Arial,sans-serif;padding:22px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{font-weight:900;font-size:23px;letter-spacing:1px}.brand b{color:#f12d49}
.panel{max-width:620px;margin:auto}.card{background:#151515;border:1px solid #333;border-radius:18px;padding:18px;margin:14px 0}
h1{font-size:21px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}
p{color:#bbb;line-height:1.45}.muted{font-size:12px;color:#999}
input{width:100%;padding:15px;margin:8px 0;background:#090909;color:white;border:1px solid #444;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 15px;font-weight:800;background:#e52d49;color:white;cursor:pointer}
button:disabled{opacity:.5}.secondary{background:#292929;border:1px solid #555}.green{background:#128c57}.red{background:#a91f35}
.full{width:100%;margin-top:8px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.user{padding:14px 0;border-bottom:1px solid #333}.user small{display:block;color:#aaa;margin:5px 0 10px;overflow-wrap:anywhere}
.status{font-size:13px;color:#ffc5cd;min-height:20px;margin-top:10px}.hidden{display:none!important}
.pill{font-size:11px;border:1px solid #555;border-radius:20px;padding:5px 8px;color:#ddd}
</style></head>
<body><main class="panel">
<header><div class="brand">DORA<span style="color:white">MAX</span> <b>ADM</b></div><button id="logout" class="secondary hidden">SAIR</button></header>
<section id="login" class="card"><h1>Painel administrativo</h1><p>Entre com a conta que já possui permissão de administrador no DORAMAX.</p>
<form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="E-mail do administrador" required><input id="password" type="password" autocomplete="current-password" placeholder="Senha" required><button class="full" id="loginBtn">ENTRAR</button></form><div id="loginStatus" class="status"></div></section>
<section id="dashboard" class="hidden">
<div class="card"><div class="row"><div><h1>Controle de acessos</h1><p class="muted">Autorize ou bloqueie usuários do DORAMAX-GRATIS.</p></div><span class="pill">ADM</span></div>
<input id="search" type="search" placeholder="Buscar por e-mail"><button id="searchBtn" class="full">BUSCAR USUÁRIO</button><button id="listBtn" class="full secondary">ATUALIZAR LISTA</button><div id="users"></div><div id="dashStatus" class="status"></div></div>
<div class="card"><h2>Notificações de pagamento</h2><button id="paymentsBtn" class="full secondary">ATUALIZAR NOTIFICAÇÕES</button><div id="payments" class="muted">Toque para carregar.</div></div>
</section>
</main>
<script>
(()=>{"use strict";
const URL="https://qbwsaahlkovrejwliefv.supabase.co";
const KEY="sb_publishable_IUeH0RsYhkHpsBflAPo1WQ_1VVPbsAK";
const STORE="doramax_adm_session_v1";
let session=null,admin=false;
const $=id=>document.getElementById(id);
const headers=token=>({"apikey":KEY,"Authorization":"Bearer "+(token||KEY),"Content-Type":"application/json"});
async function api(path,opts={},token){const r=await fetch(URL+path,{...opts,headers:{...headers(token),...(opts.headers||{})}});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d&&(d.msg||d.message||d.error_description||d.error)||"Erro HTTP "+r.status);return d}
function status(id,msg){$(id).textContent=msg||""}
function save(v){session=v;if(v)localStorage.setItem(STORE,JSON.stringify(v));else localStorage.removeItem(STORE)}
async function verify(){if(!session||!session.access_token)throw Error("Faça login novamente.");const me=await api("/auth/v1/user",{},session.access_token);const rows=await api("/rest/v1/admin_users?select=user_id&user_id=eq."+encodeURIComponent(me.id),{},session.access_token);if(!Array.isArray(rows)||!rows.length)throw Error("Esta conta não está autorizada como administradora.");admin=true;$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logout").classList.remove("hidden");await listUsers()}
async function login(e){e.preventDefault();const b=$("loginBtn");b.disabled=true;status("loginStatus","Verificando acesso...");try{const v=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("email").value.trim().toLowerCase(),password:$("password").value})});save(v);await verify();status("dashStatus","Administrador conectado com segurança.")}catch(err){save(null);admin=false;status("loginStatus",err.message)}finally{b.disabled=false}}
async function renderUsers(profiles){const out=$("users");out.replaceChildren();if(!profiles.length){out.textContent="Nenhum usuário encontrado.";return}for(const p of profiles){const grants=await api("/rest/v1/access_grants?select=is_unlocked&user_id=eq."+encodeURIComponent(p.user_id),{},session.access_token);const unlocked=!!(grants[0]&&grants[0].is_unlocked);const item=document.createElement("div");item.className="user";const title=document.createElement("strong");title.textContent=p.email||p.user_id;const info=document.createElement("small");info.textContent=unlocked?"ACESSO COMPLETO LIBERADO":"ACESSO BLOQUEADO";const btn=document.createElement("button");btn.className=unlocked?"red":"green";btn.textContent=unlocked?"BLOQUEAR ACESSO":"LIBERAR ACESSO";btn.onclick=async()=>{btn.disabled=true;try{const result=await api("/rest/v1/access_grants?user_id=eq."+encodeURIComponent(p.user_id),{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({is_unlocked:!unlocked})},session.access_token);if(!result||!result.length)throw Error("O servidor não confirmou a alteração. Verifique as políticas de acesso do Supabase.");status("dashStatus","Permissão atualizada para "+(p.email||"usuário")+".");await listUsers()}catch(err){status("dashStatus",err.message);btn.disabled=false}};item.append(title,info,btn);out.append(item)}}
async function listUsers(){if(!admin)return;status("dashStatus","Carregando usuários...");try{const p=await api("/rest/v1/profiles?select=user_id,email&order=created_at.desc&limit=100",{},session.access_token);await renderUsers(p);status("dashStatus",p.length+" usuário(s) carregado(s).")}catch(e){status("dashStatus",e.message)}}
async function search(){if(!admin)return;const email=$("search").value.trim().toLowerCase();if(!email){status("dashStatus","Digite o e-mail para buscar.");return}try{const p=await api("/rest/v1/profiles?select=user_id,email&email=ilike."+encodeURIComponent(email),{},session.access_token);await renderUsers(p);status("dashStatus",p.length+" resultado(s).")}catch(e){status("dashStatus",e.message)}}
async function payments(){if(!admin)return;const box=$("payments");box.textContent="Carregando...";try{const p=await api("/rest/v1/payment_click_notifications?select=email,amount,clicked_at&order=clicked_at.desc&limit=30",{},session.access_token);box.replaceChildren();if(!p.length){box.textContent="Nenhuma notificação.";return}p.forEach(x=>{const d=document.createElement("p");d.textContent=(x.email||"E-mail não informado")+" — R$ "+Number(x.amount||5).toFixed(2)+" — "+new Date(x.clicked_at).toLocaleString("pt-BR");box.append(d)})}catch(e){box.textContent=e.message}}
async function logout(){try{if(session)await api("/auth/v1/logout",{method:"POST"},session.access_token)}catch{}save(null);admin=false;$("dashboard").classList.add("hidden");$("login").classList.remove("hidden");$("logout").classList.add("hidden");status("loginStatus","Sessão encerrada.")}
$("loginForm").addEventListener("submit",login);$("logout").addEventListener("click",logout);$("listBtn").addEventListener("click",listUsers);$("searchBtn").addEventListener("click",search);$("paymentsBtn").addEventListener("click",payments);
try{const saved=localStorage.getItem(STORE);if(saved){session=JSON.parse(saved);verify().catch(()=>{save(null);status("loginStatus","Entre novamente para confirmar sua autorização.")})}}catch{save(null)}
})();
</script></body></html>
